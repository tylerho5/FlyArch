name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/training.in

      # requirements/training.in targets the CUDA container: torch comes from the
      # base image and pyg-lib and NCCL are CUDA builds. Install torch from the CPU
      # index and drop those lines; the other pins are used as written.
      - name: Install dependencies
        run: |
          grep -vE '^(--find-links|pyg-lib|nvidia-nccl)' requirements/training.in > "$RUNNER_TEMP/cpu-requirements.txt"
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/cpu-requirements.txt"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
